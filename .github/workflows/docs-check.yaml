name: Verify Documentation

on:
  push:
    branches: [main]
    paths:
      - "Docs/**"
  pull_request:
    branches: [main]
    paths:
      - "Docs/**"

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Docs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Lunaria requires full history logs to calculate translation diff
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Docs/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify Formatting Guardrails
        run: npx prettier --check .

      - name: Build Production Site (Validates Links & Schemas)
        run: npm run build

      - name: Build Lunaria Localization Dashboard
        run: npm run lunaria:build

      - name: Upload Translation Status Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: translation-status-dashboard
          path: Docs/dist/lunaria/
          retention-days: 14
